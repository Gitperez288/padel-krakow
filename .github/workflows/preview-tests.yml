name: Preview browser tests

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      pull_request:
        description: Open same-repository PR number
        required: true
        type: string
      reviewed_sha:
        description: Full 40-character PR head SHA you reviewed and approve for secret-backed tests
        required: true
        type: string

permissions:
  contents: read

jobs:
  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      deployments: read
    outputs:
      approved: ${{ steps.gate.outputs.approved }}
      sha: ${{ steps.gate.outputs.sha }}
      origin: ${{ steps.gate.outputs.origin }}
      polish: ${{ steps.gate.outputs.polish }}
      runner_sha: ${{ steps.trusted.outputs.sha }}
    steps:
      # Never execute PR-controlled workflows, packages, or test code with secrets.
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - id: trusted
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: gate
        uses: actions/github-script@v7
        with:
          script: |
            const { default: gate } = await import(`${process.env.GITHUB_WORKSPACE}/tests/preview/gate.mjs`);
            await gate({ github, context, core });

  pending:
    needs: authorize
    if: needs.authorize.outputs.approved == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      statuses: write
    steps:
      - uses: actions/github-script@v7
        env:
          TARGET_SHA: ${{ needs.authorize.outputs.sha }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: process.env.TARGET_SHA,
              state: 'pending',
              context: 'Preview browser tests',
              description: 'Approved preview checks are running',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

  browser:
    needs: [authorize, pending]
    if: needs.authorize.outputs.approved == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.authorize.outputs.runner_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/preview/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: tests/preview
      - run: npm run test:guards
        working-directory: tests/preview
      - run: npx playwright install --with-deps chromium
        working-directory: tests/preview
      - name: Read-only preview checks
        working-directory: tests/preview
        env:
          PREVIEW_URL: ${{ needs.authorize.outputs.origin }}
          EXPECT_POLISH: ${{ needs.authorize.outputs.polish }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npm test
      # No trace/HAR/report upload: network artifacts can contain the bypass token.

  report:
    needs: [authorize, browser]
    if: always() && needs.authorize.outputs.approved == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      statuses: write
    steps:
      - uses: actions/github-script@v7
        env:
          TARGET_SHA: ${{ needs.authorize.outputs.sha }}
          TEST_RESULT: ${{ needs.browser.result }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: process.env.TARGET_SHA,
              state: process.env.TEST_RESULT === 'success' ? 'success' : 'failure',
              context: 'Preview browser tests',
              description: `Browser checks: ${process.env.TEST_RESULT}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
