name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  preview-browser-regression:
    name: Preview routing in Chromium (no secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/preview/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: tests/preview
      - run: npx playwright install --with-deps chromium
        working-directory: tests/preview
      - run: node --test route-browser.test.mjs
        working-directory: tests/preview

  preview-guards:
    name: Preview security guards (no secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/preview/guard.test.mjs tests/preview/gate.test.mjs tests/preview/route-handler.test.mjs

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Check TypeScript
        run: npm run typecheck
